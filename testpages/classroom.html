<!DOCTYPE html>
<html lang="en" data-style="classroom">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark">
  <title>webmapx — classroom style</title>
  <link rel="stylesheet" href="../node_modules/@shoelace-style/shoelace/dist/themes/light.css">
  <link rel="stylesheet" href="../node_modules/@shoelace-style/shoelace/dist/themes/dark.css">
  <link rel="stylesheet" href="../node_modules/maplibre-gl/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../src/theme/webmapx-style-core.css">
  <script>
    // Prototype of the EduGIS design round 1 (8 Oct 2026). Query parameters:
    //   ?labels=1        expanded rail, names beside the tiles
    //   ?theme=dark      dark theme
    //   ?style=atlas     compare against another style
    //   ?override=1      3D forced to orange by config `color`, to show an override
    //   ?few=1           a five-tool config, to show colours are assigned by position
    //   ?adapter=openlayers
    // Classic script: data-theme/data-style go on <html> before first paint;
    // the config's `ui` section below then keeps them (src/utils/appearance.ts).
    const params = new URLSearchParams(location.search);
    const style = params.get('style') ?? 'classroom';
    const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
    const html = document.documentElement;
    html.setAttribute('data-style', style);
    if (theme === 'dark') {
      html.setAttribute('data-theme', 'dark');
      html.classList.add('sl-theme-dark');
      html.style.colorScheme = 'dark';
    }
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    #switches {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; gap: 12px; padding: 6px 12px;
      font: 13px/1.4 system-ui, sans-serif; border-radius: 8px;
      background: rgb(255 255 255 / .9); color: #16202a;
    }
    #switches a { color: inherit; }
  </style>
</head>
<body>
  <div id="map"></div>
  <nav id="switches"></nav>
  <script type="module">
    import { WebMapX } from '../src/lib.ts';

    const params = new URLSearchParams(location.search);

    // Toggle links, each flipping one parameter of the current URL.
    const nav = document.getElementById('switches');
    for (const [key, on, label] of [
      ['labels', '1', 'labels'], ['theme', 'dark', 'dark'], ['override', '1', 'override'],
      ['few', '1', 'five tools'], ['style', 'atlas', 'atlas'],
    ]) {
      const next = new URLSearchParams(params);
      if (params.get(key) === on) next.delete(key); else next.set(key, on);
      const a = document.createElement('a');
      a.href = '?' + next;
      a.textContent = (params.get(key) === on ? '✓ ' : '') + label;
      nav.appendChild(a);
    }

    // The UI tests' own fixture: references its data in place, so it works
    // without the config checkout.
    const res = await fetch('../tests/fixtures/demo.json');
    const config = await res.json();
    const toolbar = config.tools.mainToolbar;

    // Dutch labels, as in the deck.
    const NL = { search: 'Zoeken', layerTree: 'Lagen', info: 'Info', measure: 'Meten',
      geolocation: 'Locatie', '3d': '3D', draw: 'Tekenen', toolbox: 'Gereedschapskist',
      timeSlider: 'Tijd', deeptime: 'Diepe tijd', settings: 'Instellingen', stories: 'Verhalen' };
    // The deck's order: Zoeken, Lagen, Meten, Info, 3D — which the positional
    // palette turns into its cyan, green, yellow, orange, purple.
    const ORDER = ['search', 'layerTree', 'measure', 'info', '3d', 'draw', 'geolocation',
      'toolbox', 'timeSlider', 'deeptime', 'spacer', 'settings', 'stories'];
    const byId = new Map(toolbar.items.map((item) => [item.id ?? item.type, item]));
    let items = ORDER.map((id) => byId.get(id)).filter(Boolean);
    if (params.get('few') === '1') {
      items = items.filter((item) => ['layerTree', 'info', '3d', 'draw', 'stories'].includes(item.id));
    }
    for (const item of items) {
      if (NL[item.id]) item.title = NL[item.id];
      if (item.id === '3d' && params.get('override') === '1') item.color = 'orange';
    }
    toolbar.items = items;
    toolbar.labels = params.get('labels') === '1';
    // The appearance is the config's to set. A choice made in this browser's
    // Settings tool would still outrank it — on purpose, see appearance.ts.
    config.ui = { style: params.get('style') ?? 'classroom', theme: params.get('theme') === 'dark' ? 'dark' : 'light' };

    if (params.get('adapter')) config.map.type = params.get('adapter');

    await WebMapX.mount('#map', { config, configUrl: res.url });
  </script>
</body>
</html>
