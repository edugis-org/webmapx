<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="../favicon.png">
  <!-- Before any stylesheet: this is the window Chrome's auto-dark heuristic
       decides in, and an undeclared page gets its colours rewritten. -->
  <meta name="color-scheme" content="light dark">
  <title>WebMapX Preview</title>
  <link rel="stylesheet" href="/node_modules/@shoelace-style/shoelace/dist/themes/light.css">
  <link rel="stylesheet" href="/node_modules/@shoelace-style/shoelace/dist/themes/dark.css">
  <script>
    // Apply the theme before first paint to avoid a flash, and keep applying it.
    //
    // Two things it has to get right, both found the hard way:
    //
    //  - 'auto' is what webmapx-settings stores for "match system", so it must be
    //    resolved against the OS here exactly as its resolvedTheme() does. Treating
    //    it as "not dark" made a stored 'auto' come up light on a dark machine.
    //
    //  - the media query is *followed*, not sampled once. A fresh Chrome renderer
    //    (a new incognito window) answers prefers-color-scheme from its default
    //    before the browser process has pushed the real OS preference, and corrects
    //    itself a moment later; measured: dark on the first paint, false when read
    //    from the console seconds later, and light on the reload's warm renderer.
    //    Sampling once froze that stale answer for the life of the page.
    (function () {
      var query = window.matchMedia('(prefers-color-scheme: dark)');
      function apply() {
        var stored = localStorage.getItem('webmapx-theme');
        var dark = stored === 'dark'
          || ((!stored || stored === 'auto') && query.matches);
        var html = document.documentElement;
        html.classList.toggle('sl-theme-dark', dark);
        if (dark) html.setAttribute('data-theme', 'dark');
        else html.removeAttribute('data-theme');
        // Stated inline as well as in the stylesheet: the stylesheet has not arrived yet.
        html.style.colorScheme = dark ? 'dark' : 'light';
      }
      apply();
      query.addEventListener('change', apply);
    })();
  </script>
  <link rel="stylesheet" href="/node_modules/maplibre-gl/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/src/theme/webmapx-style-core.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
    #error { font-family: sans-serif; padding: 2rem; color: #c00; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="error" hidden></div>
  <script type="module">
    import { WebMapX } from '/src/lib.ts';

    // Allows a caller (e.g. setup.html's embedded Map-tab preview iframe) to point this
    // page at its own localStorage key, independent of the main "Update preview" window.
    const STORAGE_KEY = new URLSearchParams(window.location.search).get('storageKey') ?? 'webmapx-setup-config';

    function showError(msg) {
      document.getElementById('map').hidden = true;
      const el = document.getElementById('error');
      el.hidden = false;
      el.textContent = msg;
    }

    async function loadAndMount() {
      const params = new URLSearchParams(window.location.search);
      const configUrl = params.get('config');
      const raw = localStorage.getItem(STORAGE_KEY);
      // Base for relative resource paths inside the config. Without it a config
      // fetched from another origin in setup.html would resolve its sibling data
      // files against this page instead of against the config's own location.
      let baseUrl = null;
      let config;
      if (raw) {
        // localStorage always wins — setup.html writes the fully-merged config here.
        // Said out loud, because this page otherwise looks like it is showing the
        // file you asked for: a stale snapshot here survives every reload (it is
        // not an HTTP cache), so edits to the config on disk appear to do
        // nothing at all until the key is cleared.
        console.warn(
          `[preview] using the config saved in localStorage ("${STORAGE_KEY}")`
          + (configUrl ? `, ignoring ?config=${configUrl}` : '')
          + `. Saved ${raw.length} characters. To load the file instead:`
          + ` localStorage.removeItem('${STORAGE_KEY}') and reload.`,
        );
        try { config = JSON.parse(raw); }
        catch { showError('Config in localStorage is invalid JSON.'); return; }
        // Written by setup.html beside the config itself (see storeConfig there).
        baseUrl = localStorage.getItem(STORAGE_KEY + '-url');
      } else if (configUrl) {
        // No localStorage override — load the base config from URL param.
        try {
          const res = await fetch(configUrl);
          if (!res.ok) throw new Error(res.statusText);
          config = await res.json();
          baseUrl = res.url;
        } catch (e) {
          showError('Failed to load config from URL: ' + e.message);
          return;
        }
      } else {
        // No localStorage and no config URL — fall back to demo config
        try {
          const res = await fetch('../config/demo.json');
          if (!res.ok) throw new Error(res.statusText);
          config = await res.json();
          baseUrl = res.url;
        } catch (e) {
          showError('No config in localStorage and failed to load demo.json: ' + e.message);
          return;
        }
      }
      try {
        await WebMapX.mount('#map', { config, configUrl: baseUrl ?? undefined });
      } catch (e) {
        showError('Mount failed: ' + e.message);
      }
    }

    // Reload when setup.html pushes a new config.
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) location.reload();
    });

    loadAndMount();
  </script>
</body>
</html>
