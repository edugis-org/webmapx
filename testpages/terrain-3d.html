<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test: 3D terrain (active at startup)</title>
  <link rel="stylesheet" href="../node_modules/@shoelace-style/shoelace/dist/themes/light.css">
  <link rel="stylesheet" href="../node_modules/maplibre-gl/dist/maplibre-gl.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    import { WebMapX } from '../src/lib.ts';
    import { BASE_LAYER_DATA_WITH_TERRAIN, BASE_STATE, BASE_RUNTIME_MAP, TERRAIN_SOURCE } from './shared-config.js';

    await WebMapX.mount('#map', {
      config: {
        engine: 'maplibre',
        tools: ['3d', 'measure'],
        map: { center: [6.5, 46.5], zoom: 9, pitch: 50 }, // Alps area, tilted view
        runtimeMap: BASE_RUNTIME_MAP,
        layerData: BASE_LAYER_DATA_WITH_TERRAIN,
        state: BASE_STATE
      }
    });

    // Activate terrain immediately after mount
    const mapEl = document.querySelector('#map-webmapx');
    const adapter = await mapEl.getAdapterAsync?.();
    if (adapter) {
      adapter.setTerrainEnabled(true, {
        ...TERRAIN_SOURCE,
        id: 'terrain-source'
      });
    }
  </script>
</body>
</html>
