<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test: Sandbox (edit freely)</title>
  <link rel="stylesheet" href="../node_modules/@shoelace-style/shoelace/dist/themes/light.css">
  <link rel="stylesheet" href="../node_modules/maplibre-gl/dist/maplibre-gl.css">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    import { WebMapX } from '../src/lib.ts';
    import {
      BASE_MAP,
      BASE_RUNTIME_MAP,
      BASE_LAYER_DATA,
      BASE_LAYER_DATA_WITH_TERRAIN,
      BASE_STATE,
      TERRAIN_SOURCE
    } from './shared-config.js';

    // Edit tools list to test combinations:
    // All available: 'layerTree', 'draw', 'measure', 'search', 'print', 'import',
    //                'geolocation', 'info', '3d', 'view-mode', 'truearea', 'settings'
    const tools = [
      'draw',
      'measure',
      // 'search',
      // 'print',
      // 'import',
      // 'geolocation',
      // 'info',
      // '3d',
      // 'truearea',
      // 'settings',
    ];

    // Switch between BASE_LAYER_DATA (no terrain) and BASE_LAYER_DATA_WITH_TERRAIN
    const layerData = BASE_LAYER_DATA_WITH_TERRAIN;

    WebMapX.mount('#map', {
      config: {
        engine: 'maplibre',
        tools,
        map: { ...BASE_MAP /* center: [lon, lat], zoom: N */ },
        runtimeMap: BASE_RUNTIME_MAP,
        layerData,
        state: BASE_STATE
      }
    });
  </script>
</body>
</html>
