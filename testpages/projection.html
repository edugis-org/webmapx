<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>webmapx — projection test (OpenLayers)</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #wrap { display: flex; height: 100%; }
    #map-container { flex: 1; position: relative; }
    #panel { width: 320px; position: relative; z-index: 10; background: #fff; padding: 12px; box-sizing: border-box; border-left: 1px solid #ddd; overflow: auto; }
  </style>
  <script type="module" src="../src/app.js"></script>
</head>
<body>
  <div id="wrap">
    <webmapx-map id="map-container" adapter="openlayers" src="../config/demo.json"></webmapx-map>
    <div id="panel">
      <h3>Projection</h3>
      <webmapx-projection-tool map="#map-container"></webmapx-projection-tool>
    </div>
  </div>
  <script type="module">
    import '../src/components/webmapx-projection-tool.ts';
  </script>
</body>
</html>
