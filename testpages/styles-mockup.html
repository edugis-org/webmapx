<!DOCTYPE html>
<html lang="en" data-style="atlas">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark">
  <title>webmapx — style mock-ups</title>
  <link rel="stylesheet" href="../node_modules/@shoelace-style/shoelace/dist/themes/light.css">
  <link rel="stylesheet" href="../node_modules/@shoelace-style/shoelace/dist/themes/dark.css">
  <link rel="stylesheet" href="../node_modules/maplibre-gl/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../src/theme/webmapx-style-core.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&family=Nunito:wght@400;600;700&family=Poppins:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600&family=Merriweather:wght@400;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <script>
    // Mock-ups of new styles on the real map. Query parameters:
    //   ?style=glass|pebble|studio|island|ink   (or atlas/folio/console/classroom to compare)
    //   ?theme=dark
    // Every candidate below sets FORM only (radius, surface, shadow, density, type,
    // label treatment) — never a colour — so each works in both themes, as the
    // token rules in webmapx-style-core.css require.
    const params = new URLSearchParams(location.search);
    window.MOCK_STYLE = params.get('style') ?? 'glass';
    const html = document.documentElement;
    html.setAttribute('data-style', window.MOCK_STYLE);
    if (params.get('theme') === 'dark') {
      html.setAttribute('data-theme', 'dark');
      html.classList.add('sl-theme-dark');
      html.style.colorScheme = 'dark';
    }
  </script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    /* ── Candidate 1: glass — frosted, light, airy. ───────────────────────
       Translucent with a strong blur, so the map shows through as colour but
       never as detail behind text. atlas went opaque because a panel at 14%
       read differently per backdrop; at 72% + 20px blur that effect is small,
       but it is the thing to judge here (try it over the globe). */
    html[data-style="glass"] {
      --webmapx-font-ui: "Inter", system-ui, sans-serif;
      --webmapx-radius-xs: 6px; --webmapx-radius-sm: 10px;
      --webmapx-radius-md: 14px; --webmapx-radius-lg: 18px;
      --webmapx-surface-alpha: .72;
      --webmapx-surface-blur: blur(20px) saturate(1.6);
      --webmapx-surface-border: 1px solid rgb(var(--color-surface-rgb) / .55);
      --webmapx-surface-radius: var(--webmapx-radius-lg);
      --webmapx-surface-shadow: 0 1px 1px rgb(var(--shadow-key) / .05), 0 18px 40px -12px rgb(var(--shadow-key) / .28);
      --webmapx-row-height: 36px; --webmapx-hit-size: 40px;
      --webmapx-label-transform: none; --webmapx-label-spacing: 0;
      --sl-border-radius-small: var(--webmapx-radius-sm);
      --sl-border-radius-medium: var(--webmapx-radius-md);
      --sl-border-radius-large: var(--webmapx-radius-lg);
    }

    /* ── Candidate 2: pebble — friendly, fully rounded, no edges. ─────────
       Pills for controls, very round panels, a soft lift instead of borders,
       sentence-case labels. The calm consumer-app look; good for learners. */
    html[data-style="pebble"] {
      --webmapx-font-ui: "Nunito", system-ui, sans-serif;
      --webmapx-radius-xs: 999px; --webmapx-radius-sm: 999px;
      --webmapx-radius-md: 16px; --webmapx-radius-lg: 24px;
      --webmapx-space-md: .9rem; --webmapx-space-lg: 1.15rem;
      --webmapx-font-size-md: .925rem;
      --webmapx-surface-alpha: 1; --webmapx-surface-blur: none;
      --webmapx-surface-border: 0 solid transparent;
      --webmapx-surface-radius: var(--webmapx-radius-lg);
      --webmapx-surface-shadow: 0 2px 6px rgb(var(--shadow-key) / .08), 0 10px 28px rgb(var(--shadow-key) / .14);
      --webmapx-row-height: 40px; --webmapx-hit-size: 44px;
      --webmapx-label-transform: none; --webmapx-label-spacing: 0; --webmapx-label-size: .8rem;
      --sl-border-radius-small: 999px; --sl-border-radius-medium: 999px; --sl-border-radius-large: 24px;
      /* The rail must be at least as round as its buttons: a one-button toolbar
         (the legend toggle) is a circle in a 24px-rounded square otherwise, and
         the square's corners show as a rim around it. */
      --webmapx-toolbar-radius: 999px;
      --sl-input-height-medium: 2.6rem;
    }

    /* ── Candidate 3: studio — crisp, flat, precise. ──────────────────────
       No shadows at all; a firm 1.5px edge and medium radius do the work.
       The look of current design tools: calm, dense enough, very legible. */
    html[data-style="studio"] {
      --webmapx-font-ui: "Inter", system-ui, sans-serif;
      --webmapx-radius-xs: 4px; --webmapx-radius-sm: 6px;
      --webmapx-radius-md: 8px; --webmapx-radius-lg: 10px;
      --webmapx-surface-alpha: 1; --webmapx-surface-blur: none;
      --webmapx-surface-border: 1.5px solid var(--color-border);
      --webmapx-surface-radius: var(--webmapx-radius-lg);
      --webmapx-surface-shadow: none;
      --webmapx-row-height: 32px; --webmapx-hit-size: 36px;
      --webmapx-label-size: .6875rem; --webmapx-label-spacing: .08em;
      --sl-border-radius-small: 6px; --sl-border-radius-medium: 8px; --sl-border-radius-large: 10px;
    }

    /* ── Candidate 4: island — big detached islands floating high. ────────
       Larger gap to the map edge, generous radius, one deep diffuse shadow,
       bigger touch targets. Made for tablets and touch screens. */
    html[data-style="island"] {
      --webmapx-font-ui: "Manrope", system-ui, sans-serif;
      --webmapx-radius-xs: 8px; --webmapx-radius-sm: 12px;
      --webmapx-radius-md: 16px; --webmapx-radius-lg: 22px;
      --webmapx-space-md: .9rem; --webmapx-space-lg: 1.25rem;
      --webmapx-surface-alpha: 1; --webmapx-surface-blur: none;
      --webmapx-surface-border: 1px solid var(--color-border-light);
      --webmapx-surface-radius: var(--webmapx-radius-lg);
      --webmapx-surface-shadow: 0 30px 60px -20px rgb(var(--shadow-key) / .35), 0 6px 14px rgb(var(--shadow-key) / .08);
      --webmapx-row-height: 42px; --webmapx-hit-size: 48px;
      --webmapx-label-transform: none; --webmapx-label-spacing: .01em;
      --overlay-inset: 24px;
      --sl-border-radius-small: 12px; --sl-border-radius-medium: 14px; --sl-border-radius-large: 22px;
      --sl-input-height-medium: 2.75rem;
    }

    /* ── Candidate 5: ink — playful neo-brutalist, for the classroom. ────
       A heavy outline and a hard offset shadow in the text colour, so it
       follows the theme without naming a colour. Bold and memorable; the
       outline also helps in bright rooms and on projectors. */
    html[data-style="ink"] {
      --webmapx-font-ui: "Space Grotesk", system-ui, sans-serif;
      --webmapx-radius-xs: 4px; --webmapx-radius-sm: 6px;
      --webmapx-radius-md: 8px; --webmapx-radius-lg: 10px;
      --webmapx-surface-alpha: 1; --webmapx-surface-blur: none;
      --webmapx-surface-border: 2px solid var(--color-text-primary);
      --webmapx-surface-radius: var(--webmapx-radius-lg);
      --webmapx-surface-shadow: 4px 4px 0 var(--color-text-primary);
      --webmapx-row-height: 36px; --webmapx-hit-size: 40px;
      --webmapx-label-spacing: .1em; --webmapx-label-size: .7rem;
      --sl-border-radius-small: 6px; --sl-border-radius-medium: 8px; --sl-border-radius-large: 10px;
      --sl-input-border-width: 2px;
    }

    /* Icon size — form, so per style. Today a toolbar icon inherits Shoelace's
       14px text size whatever the button size, which leaves it a third of a
       40–48px tile; modern toolbars sit near half. The map controls (zoom,
       compass, fullscreen) read --webmapx-control-icon-size already; the rule
       below applies the same token to tool icons. Was
       --webmapx-toolbar-icon-size in an earlier draft. */
    html[data-style="glass"]  { --webmapx-control-icon-size: 19px; }
    html[data-style="pebble"] { --webmapx-control-icon-size: 21px; }
    html[data-style="studio"] { --webmapx-control-icon-size: 18px; }
    html[data-style="island"] { --webmapx-control-icon-size: 23px; }
    html[data-style="ink"]    { --webmapx-control-icon-size: 20px; }
    html[data-style] webmapx-toolbar sl-button > sl-icon {
      font-size: var(--webmapx-control-icon-size, inherit);
    }

    /* ════ FONTS — overrides the style's own font, to try type on its own.
       Declared after the styles so equal specificity lets these win. Shoelace
       reads --sl-font-sans, so inputs and buttons follow too. */
    html[data-font="system"]    { --webmapx-font-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    html[data-font="inter"]     { --webmapx-font-ui: "Inter", system-ui, sans-serif; }
    html[data-font="poppins"]   { --webmapx-font-ui: "Poppins", system-ui, sans-serif; }
    html[data-font="nunito"]    { --webmapx-font-ui: "Nunito", system-ui, sans-serif; }
    html[data-font="atkinson"]  { --webmapx-font-ui: "Atkinson Hyperlegible", system-ui, sans-serif; }
    html[data-font="lexend"]    { --webmapx-font-ui: "Lexend", system-ui, sans-serif; }
    html[data-font="merriweather"] { --webmapx-font-ui: "Merriweather", Georgia, serif; }
    html[data-font="condensed"] { --webmapx-font-ui: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; }
    html[data-font="mono"]      { --webmapx-font-ui: "JetBrains Mono", ui-monospace, monospace; }
    html[data-style] { --sl-font-sans: var(--webmapx-font-ui); }

    /* ════ COLOUR: palettes ═══════════════════════════════════════════════
       The colour axis, separate from the styles above (form only). A palette
       is a *theme pair*: each sets a light and a dark variant of the same
       colour tokens [data-theme] sets, so any palette goes with any style.
       Accent text is chosen ≥ 4.5:1 on its own surface (WCAG AA). Shoelace's
       primary scale follows the accent, so switches, focus rings and the
       active toolbar button change with it. */
    html[data-palette] {
      --color-primary-hover: color-mix(in srgb, var(--color-primary) 80%, black);
      --color-primary-soft: color-mix(in srgb, var(--color-primary) 12%, var(--color-surface));
      --color-surface-raised: color-mix(in srgb, var(--color-primary) 4%, var(--color-surface));
      --color-background: var(--color-surface);
      --color-background-tertiary: color-mix(in srgb, var(--color-primary) 10%, var(--color-background-secondary));
      --color-background-hover: color-mix(in srgb, var(--color-primary) 9%, transparent);
      --color-text-muted: var(--color-text-secondary);
      --sl-color-primary-50: var(--color-primary-soft);
      --sl-color-primary-100: color-mix(in srgb, var(--color-primary) 20%, var(--color-surface));
      --sl-color-primary-300: color-mix(in srgb, var(--color-primary) 55%, var(--color-surface));
      --sl-color-primary-500: color-mix(in srgb, var(--color-primary) 85%, white);
      --sl-color-primary-600: var(--color-primary);
      --sl-color-primary-700: var(--color-primary-hover);
      --sl-input-focus-ring-color: color-mix(in srgb, var(--color-primary) 40%, transparent);
      /* Fields — every place you set something (search, text, number, select)
         — take the colour of an active legend card, so "a thing you can act
         on" has one look. Without vivid that is the card's faint accent tint;
         with vivid, the light surface the cards stand out in. */
      --webmapx-field-bg: var(--webmapx-legend-card-bg, color-mix(in srgb, var(--color-primary) 6%, var(--color-surface)));
      --sl-input-background-color: var(--webmapx-field-bg);
      /* Edges: Shoelace draws fields and buttons with its own neutral grey
         (neutral-300), which stood out against every tinted edge around it.
         All of them take the palette's edge colour, hover a step towards the
         accent. */
      --sl-input-border-color: var(--color-border);
      --sl-input-border-color-hover: color-mix(in srgb, var(--color-primary) 50%, var(--color-border));
      --sl-input-border-color-focus: var(--color-primary);
      --sl-color-neutral-300: var(--color-border);
      --sl-color-neutral-200: var(--color-border-light);
      --sl-input-background-color-hover: var(--webmapx-field-bg);
      --sl-input-background-color-focus: var(--webmapx-field-bg);
      /* Shoelace's own light grey: the selected row in the catalog tree, and
         hovered menu items. Neutral grey looks out of place on a tinted panel. */
      --sl-color-neutral-100: color-mix(in srgb, var(--color-primary) 10%, var(--color-surface));
      /* Native checkboxes/radios (the catalog's background-map choice) ignore the
         tokens otherwise and stay browser-blue. Inherited into shadow roots. */
      accent-color: var(--color-primary);
    }
    html[data-palette][data-theme="dark"] {
      --color-primary-hover: color-mix(in srgb, var(--color-primary) 78%, white);
      --color-primary-soft: color-mix(in srgb, var(--color-primary) 18%, var(--color-surface));
      --sl-color-primary-500: var(--color-primary);
      --sl-color-primary-600: color-mix(in srgb, var(--color-primary) 85%, black);
    }

    /* vivid — the same palette, turned up. Surfaces carry a clear tint, the
       panel header is a coloured band, the toolbar rail is tinted, and edges,
       selection and hover are stronger. Text keeps its contrast: tints stay
       light in the light theme and dark in the dark one. */
    html[data-palette][data-vivid] {
      --webmapx-panel-bg: color-mix(in srgb, var(--color-primary) 7%, var(--color-surface));
      /* Tool content (the legend, for one) paints --color-background over the
         panel; tinted like the panel, or it reads as a third, whiter band. */
      --color-background: var(--webmapx-panel-bg);
      /* …and the catalog paints --color-surface instead, through its own token. */
      --webmapx-layer-tree-bg: var(--webmapx-panel-bg);
      /* Legend cards: on a tinted panel a layer is the light card on it. */
      --webmapx-legend-card-bg: var(--color-surface);
      --webmapx-legend-card-border: color-mix(in srgb, var(--color-primary) 30%, var(--color-surface));
      --sl-color-neutral-100: color-mix(in srgb, var(--color-primary) 20%, var(--color-surface));
      --webmapx-panel-header-bg: color-mix(in srgb, var(--color-primary) 20%, var(--color-surface));
      --webmapx-panel-header-divider: 1px solid color-mix(in srgb, var(--color-primary) 35%, var(--color-surface));
      --webmapx-toolbar-bg: color-mix(in srgb, var(--color-primary) 14%, var(--color-surface));
      --webmapx-navigation-bg: var(--webmapx-toolbar-bg);
      --webmapx-toolbar-separator-color: color-mix(in srgb, var(--color-primary) 22%, var(--color-surface));
      --color-surface-raised: color-mix(in srgb, var(--color-primary) 10%, var(--color-surface));
      --color-primary-soft: color-mix(in srgb, var(--color-primary) 24%, var(--color-surface));
      --color-background-hover: color-mix(in srgb, var(--color-primary) 16%, transparent);
      --color-border: color-mix(in srgb, var(--color-primary) 38%, var(--color-surface));
      --color-border-light: color-mix(in srgb, var(--color-primary) 26%, var(--color-surface));
      --sl-color-neutral-0: color-mix(in srgb, var(--color-primary) 5%, var(--color-surface));
      --shadow-alpha-far: .28;
    }
    html[data-palette][data-vivid][data-theme="dark"] {
      --webmapx-panel-bg: color-mix(in srgb, var(--color-primary) 9%, var(--color-surface));
      --color-background: var(--webmapx-panel-bg);
      --webmapx-panel-header-bg: color-mix(in srgb, var(--color-primary) 24%, var(--color-surface));
      --webmapx-toolbar-bg: color-mix(in srgb, var(--color-primary) 16%, var(--color-surface));
      --webmapx-navigation-bg: var(--webmapx-toolbar-bg);
      --sl-color-neutral-0: color-mix(in srgb, var(--color-primary) 7%, var(--color-surface));
      --shadow-alpha-far: .6;
    }

    /* ocean — deep teal on a cool, faintly blue paper */
    html[data-palette="ocean"] {
      --color-primary: #0a6a86; --color-on-primary: #fff;
      --color-surface: #f7fbfc; --color-surface-rgb: 247 251 252;
      --color-background-secondary: #eaf3f6;
      --color-text-primary: #0d2530; --color-text-secondary: #4a6470;
      --color-border: #c9dde4; --color-border-light: #dbe9ee;
      --shadow-key: 10 50 70;
    }
    html[data-palette="ocean"][data-theme="dark"] {
      --color-primary: #5fc3dc; --color-on-primary: #04161c;
      --color-surface: #0e1d24; --color-surface-rgb: 14 29 36;
      --color-background-secondary: #13262e;
      --color-text-primary: #e3f1f5; --color-text-secondary: #9bb7c1;
      --color-border: #24404c; --color-border-light: #1c333d;
      --shadow-key: 0 0 0;
    }

    /* forest — moss green on warm unbleached paper, like a field guide */
    html[data-palette="forest"] {
      --color-primary: #2f6b3f; --color-on-primary: #fff;
      --color-surface: #fbf9f3; --color-surface-rgb: 251 249 243;
      --color-background-secondary: #f1eee3;
      --color-text-primary: #1e2a20; --color-text-secondary: #57614f;
      --color-border: #dcd6c4; --color-border-light: #e8e3d4;
      --shadow-key: 45 50 30;
    }
    html[data-palette="forest"][data-theme="dark"] {
      --color-primary: #8fd19e; --color-on-primary: #0c1a0f;
      --color-surface: #161c17; --color-surface-rgb: 22 28 23;
      --color-background-secondary: #1c241d;
      --color-text-primary: #e8efe6; --color-text-secondary: #a6b3a3;
      --color-border: #2f3b30; --color-border-light: #263027;
      --shadow-key: 0 0 0;
    }

    /* coral — warm terracotta on cream, sunny and inviting */
    html[data-palette="coral"] {
      --color-primary: #b93c0b; --color-on-primary: #fff;
      --color-surface: #fffaf5; --color-surface-rgb: 255 250 245;
      --color-background-secondary: #fbefe5;
      --color-text-primary: #2a1a12; --color-text-secondary: #6b5144;
      --color-border: #efd9c8; --color-border-light: #f5e6da;
      --shadow-key: 90 40 15;
    }
    html[data-palette="coral"][data-theme="dark"] {
      --color-primary: #ff9a6b; --color-on-primary: #2a0f04;
      --color-surface: #1f1612; --color-surface-rgb: 31 22 18;
      --color-background-secondary: #281d18;
      --color-text-primary: #f6e9e2; --color-text-secondary: #c4ab9e;
      --color-border: #43312a; --color-border-light: #372821;
      --shadow-key: 0 0 0;
    }

    /* violet — electric purple on a lilac-white, the playful/modern one */
    html[data-palette="violet"] {
      --color-primary: #6a3cc4; --color-on-primary: #fff;
      --color-surface: #fcfbff; --color-surface-rgb: 252 251 255;
      --color-background-secondary: #f2eefb;
      --color-text-primary: #1d1630; --color-text-secondary: #5d5475;
      --color-border: #ddd4f0; --color-border-light: #ebe5f7;
      --shadow-key: 60 30 120;
    }
    html[data-palette="violet"][data-theme="dark"] {
      --color-primary: #b79cff; --color-on-primary: #160b2e;
      --color-surface: #17131f; --color-surface-rgb: 23 19 31;
      --color-background-secondary: #1f1a2a;
      --color-text-primary: #ece7f7; --color-text-secondary: #ada4c4;
      --color-border: #342b47; --color-border-light: #2a2339;
      --shadow-key: 0 0 0;
    }

    /* graphite — near-monochrome with a lime accent, editorial and sharp */
    html[data-palette="graphite"] {
      --color-primary: #3f6a0a; --color-on-primary: #fff;
      --color-surface: #fafafa; --color-surface-rgb: 250 250 250;
      --color-background-secondary: #f0f0f0;
      --color-text-primary: #111111; --color-text-secondary: #555555;
      --color-border: #dddddd; --color-border-light: #e8e8e8;
      --shadow-key: 0 0 0;
    }
    html[data-palette="graphite"][data-theme="dark"] {
      --color-primary: #b5f23d; --color-on-primary: #111800;
      --color-surface: #141414; --color-surface-rgb: 20 20 20;
      --color-background-secondary: #1c1c1c;
      --color-text-primary: #f2f2f2; --color-text-secondary: #a8a8a8;
      --color-border: #303030; --color-border-light: #262626;
      --shadow-key: 0 0 0;
    }

    /* Switcher (not part of any style) */
    #switches {
      /* Centred and narrow (rows wrap), so it stays between an open tool panel
         on the left and the map controls on the right. */
      position: fixed; bottom: 22%; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; flex-direction: column; gap: 8px;
      width: min(440px, calc(100vw - 32px)); box-sizing: border-box;
      font-family: var(--webmapx-font-ui, system-ui, sans-serif);
      font-size: 13px; line-height: 1.3;
      color: var(--color-text-primary, #16202a);
    }
    /* One box per choice — a title, then its options, left-aligned — drawn
       with the same tokens as a tool panel, so each box shows the chosen
       style, colours and font. */
    #switches section {
      display: flex; flex-direction: column; gap: 3px;
      padding: 8px 12px;
      background: var(--webmapx-panel-bg, rgb(var(--color-surface-rgb, 255 255 255) / var(--webmapx-surface-alpha, 1)));
      -webkit-backdrop-filter: var(--webmapx-surface-blur, none);
      backdrop-filter: var(--webmapx-surface-blur, none);
      border: var(--webmapx-surface-border, 1px solid var(--color-border-light, #e2e7ec));
      border-radius: var(--webmapx-surface-radius, 10px);
      box-shadow: var(--webmapx-surface-shadow, 0 4px 12px rgba(16, 24, 40, .12));
    }
    #switches h2 {
      margin: 0; font: 600 11px/1.2 var(--webmapx-font-ui, system-ui, sans-serif);
      letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary, #5a6773);
    }
    #switches .options { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 2px; margin-left: -9px; }
    #switches a {
      color: inherit; text-decoration: none; padding: 3px 9px;
      border-radius: var(--webmapx-radius-sm, 6px);
    }
    #switches a:hover {
      background: var(--webmapx-control-hover-bg, var(--color-primary-soft, #e6f0f5));
      color: var(--webmapx-control-hover-fg, var(--color-primary, #2b6c8f));
    }
    #switches a[aria-current] {
      background: var(--color-primary, #2b6c8f); color: var(--color-on-primary, #fff); font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <nav id="switches" aria-label="Style mock-ups"></nav>
  <script type="module">
    import { WebMapX } from '../src/lib.ts';

    const params = new URLSearchParams(location.search);
    const current = window.MOCK_STYLE;
    const nav = document.getElementById('switches');
    let options = null;
    const section = (title) => {
      const s = document.createElement('section');
      s.append(Object.assign(document.createElement('h2'), { textContent: title }));
      options = Object.assign(document.createElement('div'), { className: 'options' });
      s.append(options);
      nav.append(s);
    };
    const link = (label, key, value, active) => {
      const next = new URLSearchParams(params);
      if (value === null) next.delete(key); else next.set(key, value);
      const a = Object.assign(document.createElement('a'), { href: '?' + next, textContent: label });
      if (active) a.setAttribute('aria-current', 'true');
      options.append(a);
    };

    section('Style');
    for (const s of ['glass', 'pebble', 'studio', 'island', 'ink', 'atlas', 'classroom']) link(s, 'style', s, current === s);

    section('Theme');
    const dark = params.get('theme') === 'dark';
    link('light', 'theme', null, !dark);
    link('dark', 'theme', 'dark', dark);

    section('Colours');
    const palette = params.get('palette');
    const vivid = params.get('vivid') === '1';
    link('default', 'palette', null, !palette);
    for (const p of ['ocean', 'forest', 'coral', 'violet', 'graphite']) link(p, 'palette', p, palette === p);
    link(vivid ? '✓ vivid' : 'vivid', 'vivid', vivid ? null : '1', vivid);
    if (palette) document.documentElement.setAttribute('data-palette', palette);
    if (vivid) document.documentElement.setAttribute('data-vivid', '');

    section('Font');
    const font = params.get('font');
    link("style's own", 'font', null, !font);
    for (const [f, label] of [['system', 'system'], ['inter', 'Inter'], ['poppins', 'Poppins'], ['nunito', 'Nunito'],
      ['atkinson', 'Atkinson Hyperlegible'], ['lexend', 'Lexend'], ['merriweather', 'Merriweather'],
      ['condensed', 'Plex Condensed'], ['mono', 'JetBrains Mono']]) link(label, 'font', f, font === f);
    if (font) document.documentElement.setAttribute('data-font', font);

    // The published demo config: tests/fixtures is not part of a build, and a
    // branch preview of this page is how it gets shared.
    const res = await fetch('../config/demo.json');
    const config = await res.json();
    // The config only accepts the shipped style names, so it gets atlas and the
    // candidate is put back on <html> — and kept there — once the map is up.
    const known = ['atlas', 'folio', 'console', 'classroom'];
    config.ui = { style: known.includes(current) ? current : 'atlas', theme: dark ? 'dark' : 'light' };
    await WebMapX.mount('#map', { config, configUrl: res.url });

    const html = document.documentElement;
    const keep = () => { if (html.getAttribute('data-style') !== current) html.setAttribute('data-style', current); };
    keep();
    new MutationObserver(keep).observe(html, { attributes: true, attributeFilter: ['data-style'] });
  </script>
</body>
</html>
