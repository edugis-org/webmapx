<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <title>WebMapX Setup</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; color: #555; text-transform: uppercase; letter-spacing: .05em; }
    .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.4rem; }
    .tool-list { display: flex; flex-direction: column; gap: 0.25rem; }
    label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; position: relative; }
    label input[type=checkbox] { cursor: pointer; flex-shrink: 0; }
    label.not-in-config { color: #888; font-style: italic; }
    .tool-name { flex: 1; }
    .drag-handle {
      cursor: grab; color: #bbb; font-size: 13px; flex-shrink: 0;
      user-select: none; padding: 0 2px; line-height: 1;
    }
    .drag-handle:active { cursor: grabbing; }
    label.drag-over { outline: 2px solid #0f62fe; border-radius: 3px; }
    label.dragging { opacity: 0.4; }
    .info-btn {
      width: 16px; height: 16px; border-radius: 50%; background: #ccc; color: #555;
      font-size: 10px; line-height: 16px; text-align: center; flex-shrink: 0;
      cursor: pointer; border: none; padding: 0; display: none; user-select: none;
    }
    label:hover .info-btn, label:focus-within .info-btn { display: block; }
    .info-btn.active, .info-btn:hover { background: #0f62fe; color: #fff; }

    /* Props popup */
    .prop-popup {
      display: none; position: fixed; z-index: 1000;
      background: #fff; border: 1px solid #bbb; border-radius: 6px;
      padding: 0.75rem; font-size: 0.8rem;
      width: 320px; max-height: 380px; overflow-y: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    .prop-popup.visible { display: block; }
    .toolbox-section { margin: 0.3rem 0 0.3rem 1.4rem; padding: 0.3rem 0.5rem; border-left: 2px solid #ddd; }
    .toolbox-section h4 { font-size: 0.75rem; color: #777; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 0.3rem; }
    .prop-popup h3 { margin: 0 0 0.5rem; font-size: 0.85rem; color: #333; border-bottom: 1px solid #eee; padding-bottom: 0.35rem; }
    .prop-row { display: flex; flex-direction: column; margin-bottom: 0.5rem; }
    .prop-row label { font-size: 0.75rem; color: #666; margin-bottom: 2px; font-weight: 500; cursor: default; display: block; flex: none; }
    .prop-row select { background: #fff; }
    .prop-row input[type=text], .prop-row input[type=number], .prop-row textarea, .prop-row select {
      width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 3px;
      padding: 0.25rem 0.4rem; font-size: 0.8rem; font-family: inherit;
    }
    .prop-row input[type=checkbox] { width: auto; cursor: pointer; margin-top: 2px; }
    .prop-row textarea { font-family: monospace; resize: vertical; min-height: 60px; }
    .prop-row textarea.json-invalid { border-color: #c00; }
    .prop-popup-footer { margin-top: 0.5rem; display: flex; justify-content: flex-end; gap: 0.4rem; }
    .prop-popup-footer button { padding: 0.3rem 0.7rem; font-size: 0.8rem; border-radius: 3px; cursor: pointer; border: 1px solid #ccc; background: #f5f5f5; }
    .prop-popup-footer .btn-apply { background: #0f62fe; color: #fff; border-color: #0f62fe; }

    .actions { margin-top: 2rem; display: flex; gap: 1rem; }
    button { padding: 0.6rem 1.4rem; font-size: 1rem; cursor: pointer; border: none; border-radius: 4px; }
    #btn-launch { background: #0f62fe; color: #fff; }
    #btn-launch:hover { background: #0353e9; }
    #btn-reset { background: #e0e0e0; }
    #btn-reset:hover { background: #c6c6c6; }
    #status { margin-top: 1rem; font-size: 0.875rem; color: #555; }
  </style>
</head>
<body>
  <h1>WebMapX Tool Setup</h1>
  <p>Open <a href="testpages/preview.html" target="_blank">preview.html</a> in a split tab, then use the button below to push config to it.</p>
  <div style="margin-bottom:0.5rem">
    <label><input type="checkbox" id="select-all" checked> Select / deselect all</label>
  </div>
  <div id="ui"></div>
  <div class="actions">
    <button id="btn-launch">Update preview</button>
    <button id="btn-reset">Reset to defaults</button>
    <button id="btn-download">Download config</button>
  </div>
  <div id="status"></div>

  <script type="module">
    import { KNOWN_TOOLS } from '/src/utils/dynamic-layout.ts';

    const STORAGE_KEY = 'webmapx-setup-config';

    // Derive toolbar keys dynamically from config instead of hardcoding names.
    function getToolbarKeys(config) {
      return Object.entries(config.tools ?? {})
        .filter(([, v]) => v && typeof v === 'object' && v.type === 'toolbar')
        .map(([k]) => k);
    }

    let baseConfig = null;

    // Overrides are in-memory only — cleared on reload so config defaults are always fresh.
    let sessionOverrides = {};
    function getSaved() { return sessionOverrides; }
    function saveOverrides(overrides) { sessionOverrides = overrides; }

    async function loadConfig() {
      const params = new URLSearchParams(window.location.search);
      const configUrl = params.get('config') ?? 'config/demo.json';
      const res = await fetch(configUrl);
      if (!res.ok) throw new Error(`Failed to load config: ${configUrl} (${res.status})`);
      baseConfig = await res.json();
      return baseConfig;
    }

    const TOOLBAR_TOOLS = KNOWN_TOOLS.filter(t => !t.standalone);
    const STANDALONE_TOOLS = KNOWN_TOOLS.filter(t => t.standalone);

    // Keys not shown as editable props (structural or handled elsewhere)
    const SKIP_PROPS = new Set(['id', 'type', 'enabled', 'items']);

    // Extra prop defaults injected into the ⚙ popup for specific tools,
    // so config-defined options surface even when absent from the config JSON.
    const TOOL_EXTRA_PROPS = {
      coordinates: { defaultFormat: 'geographic-en' },
    };

    const LAYOUT_POSITIONS = [
      'top-left','middle-left','bottom-left',
      'top-center','middle-center','bottom-center',
      'top-right','middle-right','bottom-right',
      'edge-bottom-left','edge-bottom-center','edge-bottom-right',
    ];

    // Metadata for well-known string properties → render as <select> instead of free text.
    // Key is the property name; value is array of allowed options.
    const PROP_OPTIONS = {
      defaultFormat:   ['geographic-en', 'geographic-local', 'lonlat', 'latlon'],
      position:        LAYOUT_POSITIONS,
      orientation:     ['vertical', 'horizontal'],
      'panel-position': ['after', 'before'],
      provider:        ['nominatim'],
      direction:       ['up', 'down', 'left', 'right'],
      tooltipPlacement:['right','left','top','bottom'],
      alignment:       ['start','center','end'],
      priority:        ['normal','high','low'],
      service:         ['xyz','wms','wmts'],
    };

    // Toolbar-level props exposed in the ⚙ popup (in addition to item-level props).
    // These live directly on the toolbar config object (tools.mainToolbar, etc.).
    const TOOLBAR_OWN_PROPS = ['position','orientation','tooltipPlacement','alignment','priority'];
    // Panel sub-object props (tools.mainToolbar.panel.*).
    const TOOLBAR_PANEL_PROPS = ['label','position'];

    // Build a synthetic props object for a toolbar to show in the popup.
    function toolbarPropsObject(toolbarCfg) {
      const obj = {};
      for (const k of TOOLBAR_OWN_PROPS) if (toolbarCfg[k] !== undefined) obj[k] = toolbarCfg[k];
      const panel = toolbarCfg.panel ?? {};
      for (const k of TOOLBAR_PANEL_PROPS) {
        const pk = 'panel.' + k;
        if (panel[k] !== undefined) obj[pk] = panel[k];
      }
      return obj;
    }

    // --- Drag-to-reorder ---
    function makeDraggable(label, orderKey) {
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⠿';
      handle.title = 'Drag to reorder';
      label.insertBefore(handle, label.firstChild);

      label.draggable = true;
      label.addEventListener('dragstart', (e) => {
        label.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', label.dataset.toolId);
        e.dataTransfer.setDragImage(label, 10, 10);
      });
      label.addEventListener('dragend', () => {
        label.classList.remove('dragging');
        label.parentElement?.querySelectorAll('label').forEach(l => l.classList.remove('drag-over'));
      });
      label.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        label.parentElement?.querySelectorAll('label').forEach(l => l.classList.remove('drag-over'));
        label.classList.add('drag-over');
      });
      label.addEventListener('dragleave', () => label.classList.remove('drag-over'));
      label.addEventListener('drop', (e) => {
        e.preventDefault();
        label.classList.remove('drag-over');
        const fromId = e.dataTransfer.getData('text/plain');
        const toId = label.dataset.toolId;
        if (!fromId || fromId === toId) return;
        const container = label.parentElement;
        const labels = [...container.querySelectorAll(':scope > label')];
        const ids = labels.map(l => l.dataset.toolId);
        const fromIdx = ids.indexOf(fromId);
        const toIdx = ids.indexOf(toId);
        if (fromIdx === -1 || toIdx === -1) return;
        ids.splice(fromIdx, 1);
        ids.splice(toIdx, 0, fromId);
        // Reorder DOM
        ids.forEach(id => {
          const el = labels.find(l => l.dataset.toolId === id);
          if (el) container.appendChild(el);
        });
        // Persist order
        const ov = getSaved();
        ov[orderKey] = ids;
        saveOverrides(ov);
      });
    }

    function applyStoredOrder(labels, orderKey) {
      const stored = getSaved()[orderKey];
      if (!stored || !Array.isArray(stored)) return labels;
      const map = new Map(labels.map(l => [l.dataset.toolId, l]));
      const ordered = stored.map(id => map.get(id)).filter(Boolean);
      // Append any new tools not yet in stored order
      for (const l of labels) if (!stored.includes(l.dataset.toolId)) ordered.push(l);
      return ordered;
    }

    // --- Props popup ---
    const popup = document.createElement('div');
    popup.className = 'prop-popup';
    document.body.appendChild(popup);

    let activeInfoBtn = null;
    let activePropsKey = null; // overrides key for current popup's props

    function closePopup() {
      popup.classList.remove('visible');
      if (activeInfoBtn) { activeInfoBtn.classList.remove('active'); activeInfoBtn = null; }
      activePropsKey = null;
    }

    document.addEventListener('mousedown', (e) => {
      if (!popup.contains(e.target) && !e.target.classList.contains('info-btn')) closePopup();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopup(); });

    function positionPopup(anchorEl) {
      const rect = anchorEl.getBoundingClientRect();
      let top = rect.bottom + 4;
      let left = rect.left;
      if (top + 380 > window.innerHeight) top = Math.max(4, rect.top - 384);
      if (left + 324 > window.innerWidth) left = Math.max(4, window.innerWidth - 328);
      popup.style.top = top + 'px';
      popup.style.left = left + 'px';
    }

    function buildPropsForm(toolLabel, baseProps, propsKey) {
      popup.innerHTML = '';
      const h3 = document.createElement('h3');
      h3.textContent = toolLabel + ' options';
      popup.appendChild(h3);

      const savedProps = getSaved()[propsKey] ?? {};

      const fields = []; // { key, getVal, isValid }

      for (const [k, baseVal] of Object.entries(baseProps)) {
        if (SKIP_PROPS.has(k)) continue;

        const currentVal = savedProps[k] !== undefined ? savedProps[k] : baseVal;
        const row = document.createElement('div');
        row.className = 'prop-row';

        const lbl = document.createElement('label');
        lbl.textContent = k;
        row.appendChild(lbl);

        let getVal, isValid = () => true;
        const options = PROP_OPTIONS[k];

        if (typeof baseVal === 'boolean') {
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = Boolean(currentVal);
          row.appendChild(cb);
          getVal = () => cb.checked;
        } else if (typeof baseVal === 'number') {
          const inp = document.createElement('input');
          inp.type = 'number';
          inp.value = String(currentVal);
          row.appendChild(inp);
          getVal = () => { const n = parseFloat(inp.value); return isNaN(n) ? baseVal : n; };
        } else if (options) {
          const sel = document.createElement('select');
          // Add a blank option if current value is not in the list
          if (!options.includes(String(currentVal))) {
            const opt = document.createElement('option');
            opt.value = String(currentVal); opt.textContent = String(currentVal);
            sel.appendChild(opt);
          }
          for (const o of options) {
            const opt = document.createElement('option');
            opt.value = o; opt.textContent = o;
            if (String(currentVal) === o) opt.selected = true;
            sel.appendChild(opt);
          }
          row.appendChild(sel);
          getVal = () => sel.value;
        } else if (typeof baseVal === 'string') {
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.value = String(currentVal);
          row.appendChild(inp);
          getVal = () => inp.value;
        } else {
          // object / array → JSON textarea
          const ta = document.createElement('textarea');
          ta.value = JSON.stringify(currentVal, null, 2);
          ta.rows = Math.min(8, (ta.value.match(/\n/g) ?? []).length + 2);
          ta.addEventListener('input', () => {
            try { JSON.parse(ta.value); ta.classList.remove('json-invalid'); }
            catch { ta.classList.add('json-invalid'); }
          });
          row.appendChild(ta);
          getVal = () => { try { return JSON.parse(ta.value); } catch { return currentVal; } };
          isValid = () => { try { JSON.parse(ta.value); return true; } catch { return false; } };
        }

        fields.push({ key: k, getVal, isValid });
        popup.appendChild(row);
      }

      const footer = document.createElement('div');
      footer.className = 'prop-popup-footer';

      const btnReset = document.createElement('button');
      btnReset.textContent = 'Reset';
      btnReset.addEventListener('click', () => {
        const ov = getSaved();
        delete ov[propsKey];
        saveOverrides(ov);
        buildPropsForm(toolLabel, baseProps, propsKey);
      });

      const btnApply = document.createElement('button');
      btnApply.className = 'btn-apply';
      btnApply.textContent = 'OK';
      btnApply.addEventListener('click', () => {
        if (fields.some(f => !f.isValid())) return;
        const ov = getSaved();
        const props = {};
        for (const f of fields) props[f.key] = f.getVal();
        ov[propsKey] = props;
        saveOverrides(ov);
        document.getElementById('status').textContent = 'Options saved — click "Update preview" to apply.';
        closePopup();
      });

      footer.appendChild(btnReset);
      footer.appendChild(btnApply);
      popup.appendChild(footer);
    }

    function openPopup(btn, toolLabel, baseProps, propsKey) {
      if (activeInfoBtn === btn) { closePopup(); return; }
      closePopup();
      activeInfoBtn = btn;
      activePropsKey = propsKey;
      btn.classList.add('active');
      buildPropsForm(toolLabel, baseProps, propsKey);
      popup.classList.add('visible');
      positionPopup(btn);
    }

    function makeToolLabel(cb, labelText, baseProps, propsKey) {
      const label = document.createElement('label');
      label.dataset.toolId = cb.dataset.tool ?? cb.dataset.standalone ?? cb.dataset.key ?? '';
      label.appendChild(cb);
      const span = document.createElement('span');
      span.className = 'tool-name';
      span.textContent = ' ' + labelText;
      label.appendChild(span);
      if (baseProps) {
        const editableProps = Object.keys(baseProps).filter(k => !SKIP_PROPS.has(k));
        if (editableProps.length > 0) {
          const btn = document.createElement('button');
          btn.className = 'info-btn';
          btn.textContent = '⚙';
          btn.title = 'Edit options';
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openPopup(btn, labelText, baseProps, propsKey);
          });
          label.appendChild(btn);
        }
      }
      return label;
    }

    function buildUI(config, overrides) {
      const ui = document.getElementById('ui');
      ui.innerHTML = '';
      closePopup();
      const tools = config.tools ?? {};

      // --- Toolbar tools (all toolbars side by side) ---
      const toolbarRow = document.createElement('div');
      toolbarRow.style.cssText = 'display:flex; gap:1.5rem; align-items:flex-start; flex-wrap:wrap;';
      ui.appendChild(toolbarRow);

      for (const toolbarKey of getToolbarKeys(config)) {
        const toolbar = tools[toolbarKey];
        // Collect items keyed by both id and type for alias lookup
        const inConfig = new Map(); // id or type → item config
        for (const item of toolbar?.items ?? []) {
          const id = item.id ?? item.type;
          if (id && id !== 'spacer') inConfig.set(id, item);
          if (item.type && item.type !== id && item.type !== 'spacer') {
            if (!inConfig.has(item.type)) inConfig.set(item.type, item);
          }
        }

        const h2 = document.createElement('h2');
        const h2Label = document.createElement('span');
        h2Label.textContent = toolbarKey === 'mainToolbar' ? 'Toolbar tools' : `${toolbarKey} tools`;
        h2.appendChild(h2Label);
        if (toolbar) {
          const tbPropsKey = `toolbar-settings:${toolbarKey}`;
          const tbProps = toolbarPropsObject(toolbar);
          if (Object.keys(tbProps).length > 0) {
            const tbBtn = document.createElement('button');
            tbBtn.className = 'info-btn';
            tbBtn.style.display = 'inline-block';
            tbBtn.style.marginLeft = '0.4rem';
            tbBtn.style.verticalAlign = 'middle';
            tbBtn.textContent = '⚙';
            tbBtn.title = 'Edit toolbar settings';
            tbBtn.addEventListener('click', (e) => {
              e.preventDefault();
              openPopup(tbBtn, toolbarKey === 'mainToolbar' ? 'Toolbar' : toolbarKey, tbProps, tbPropsKey);
            });
            h2.appendChild(tbBtn);
          }
        }
        const col = document.createElement('div');
        col.style.cssText = 'flex:1; min-width:180px;';
        toolbarRow.appendChild(col);
        col.appendChild(h2);
        const grid = document.createElement('div');
        grid.className = 'tool-list';
        const toolOrderKey = `order:toolbar:${toolbarKey}`;

        const toolLabels = [];
        let toolboxSection = null;

        for (const tool of TOOLBAR_TOOLS) {
          const key = `toolbar:${toolbarKey}:${tool.id}`;
          const propsKey = `${key}:props`;
          const item = inConfig.get(tool.id);
          const inCfg = item !== undefined;
          // Fall back to top-level standalone config for dual-mode tools (e.g. maplanguage)
          const standaloneVal = !inCfg && tools[tool.id] && typeof tools[tool.id] === 'object' ? tools[tool.id] : null;
          const defaultEnabled = inCfg ? item.enabled !== false : false;
          const enabled = overrides[key] !== undefined ? overrides[key] : defaultEnabled;
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.dataset.key = key;
          cb.dataset.toolbar = toolbarKey;
          cb.dataset.tool = tool.id;
          if (enabled) cb.checked = true;
          const label = makeToolLabel(cb, tool.label, inCfg ? item : standaloneVal, propsKey);
          if (!inCfg) label.className = 'not-in-config';
          makeDraggable(label, toolOrderKey);
          toolLabels.push(label);

          // If this is a toolbox, show its sub-items as a nested section
          if (tool.id === 'toolbox' && enabled) {
            const toolboxItem = inCfg ? item : null;
            const subSection = document.createElement('div');
            subSection.className = 'toolbox-section';
            const subH4 = document.createElement('h4');
            subH4.textContent = (toolboxItem?.title ?? toolboxItem?.label ?? 'Toolbox') + ' contents';
            subSection.appendChild(subH4);
            const subList = document.createElement('div');
            subList.className = 'tool-list';

            // Build lookup for toolbox sub-items
            const subInConfig = new Map();
            for (const sub of toolboxItem?.items ?? []) {
              const sid = sub.id ?? sub.type;
              if (sid) subInConfig.set(sid, sub);
              if (sub.type && sub.type !== sid) {
                if (!subInConfig.has(sub.type)) subInConfig.set(sub.type, sub);
              }
            }
            const toolboxId = toolboxItem?.id ?? 'toolbox';
            const subOrderKey = `order:toolbox:${toolbarKey}:${toolboxId}`;
            const subLabels = [];

            for (const subTool of TOOLBAR_TOOLS.filter(t => t.id !== 'toolbox')) {
              const subKey = `toolbox:${toolbarKey}:${toolboxId}:${subTool.id}`;
              const subPropsKey = `${subKey}:props`;
              const subItem = subInConfig.get(subTool.id);
              const subInCfg = subItem !== undefined;
              const subStandaloneVal = !subInCfg && tools[subTool.id] && typeof tools[subTool.id] === 'object' ? tools[subTool.id] : null;
              const subDefaultProps = !subInCfg && !subStandaloneVal ? { title: subTool.label, ...(subTool.icon ? { icon: subTool.icon } : {}) } : null;
              const subDefaultEnabled = subInCfg ? subItem.enabled !== false : false;
              const subEnabled = overrides[subKey] !== undefined ? overrides[subKey] : subDefaultEnabled;
              const subCb = document.createElement('input');
              subCb.type = 'checkbox';
              subCb.dataset.key = subKey;
              subCb.dataset.tool = subTool.id;
              if (subEnabled) subCb.checked = true;
              const subLabel = makeToolLabel(subCb, subTool.label, subInCfg ? subItem : (subStandaloneVal ?? subDefaultProps), subPropsKey);
              if (!subInCfg) subLabel.className = 'not-in-config';
              makeDraggable(subLabel, subOrderKey);
              subLabels.push(subLabel);
            }
            applyStoredOrder(subLabels, subOrderKey).forEach(l => subList.appendChild(l));
            subSection.appendChild(subList);
            toolboxSection = subSection;
          }
        }
        applyStoredOrder(toolLabels, toolOrderKey).forEach(l => grid.appendChild(l));
        col.appendChild(grid);
        if (toolboxSection) col.appendChild(toolboxSection);
      }

      // --- Standalone / map controls ---
      const h2s = document.createElement('h2');
      h2s.textContent = 'Map controls';
      ui.appendChild(h2s);
      const gridS = document.createElement('div');
      gridS.className = 'tool-grid';

      for (const tool of STANDALONE_TOOLS) {
        const key = `standalone:${tool.id}`;
        const propsKey = `${key}:props`;
        const val = tools[tool.id];
        const inCfg = val !== undefined && val !== null && typeof val === 'object';
        // not in config or null → give a default so the ⚙ editor still appears
        const valOrDefault = { position: 'top-left', ...(TOOL_EXTRA_PROPS[tool.id] ?? {}), ...(inCfg ? val : {}) };
        const defaultEnabled = val !== undefined ? (inCfg ? val.enabled !== false : true) : false;
        const enabled = overrides[key] !== undefined ? overrides[key] : defaultEnabled;
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.dataset.key = key;
        cb.dataset.standalone = tool.id;
        if (enabled) cb.checked = true;
        const label = makeToolLabel(cb, tool.label, valOrDefault, propsKey);
        if (!inCfg) label.className = 'not-in-config';
        gridS.appendChild(label);
      }
      ui.appendChild(gridS);

      // --- Dev tools ---
      const h2dev = document.createElement('h2');
      h2dev.textContent = 'Dev tools';
      ui.appendChild(h2dev);
      const gridDev = document.createElement('div');
      gridDev.className = 'tool-grid';
      const configEditEnabled = overrides['dev:configedit'] === true;
      const cbDev = document.createElement('input');
      cbDev.type = 'checkbox';
      cbDev.dataset.key = 'dev:configedit';
      if (configEditEnabled) cbDev.checked = true;
      const labelDev = makeToolLabel(cbDev, 'Config editor', null, null);
      labelDev.className = 'not-in-config';
      gridDev.appendChild(labelDev);
      ui.appendChild(gridDev);

      // Listen for changes
      ui.querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', () => {
          const ov = getSaved();
          ov[cb.dataset.key] = cb.checked;
          saveOverrides(ov);
          // Rebuild UI if a toolbox was toggled (sub-section appears/disappears)
          if (cb.dataset.tool === 'toolbox') {
            buildUI(baseConfig, getSaved());
          }
          updateSelectAll();
        });
      });
    }

    function applyOverrides(config, overrides) {
      const result = JSON.parse(JSON.stringify(config));
      if (!result.tools) result.tools = {};
      const tools = result.tools;

      // Toolbar items: filter disabled, add newly enabled, apply prop overrides
      for (const toolbarKey of getToolbarKeys(result)) {
        if (!tools[toolbarKey]) continue;
        const toolbar = tools[toolbarKey];

        // Apply toolbar-level setting overrides (position, orientation, panel.*, etc.)
        const tbSettingsKey = `toolbar-settings:${toolbarKey}`;
        const tbSettings = overrides[tbSettingsKey];
        if (tbSettings) {
          for (const [k, v] of Object.entries(tbSettings)) {
            if (k.startsWith('panel.')) {
              if (!toolbar.panel) toolbar.panel = {};
              toolbar.panel[k.slice(6)] = v;
            } else {
              toolbar[k] = v;
            }
          }
        }
        if (!toolbar.items) toolbar.items = [];

        // Filter out disabled items
        toolbar.items = toolbar.items.filter(item => {
          const id = item.id ?? item.type;
          if (!id || id === 'spacer') return true;
          return overrides[`toolbar:${toolbarKey}:${id}`] !== false
            && overrides[`toolbar:${toolbarKey}:${item.type}`] !== false;
        });

        // Apply prop overrides to existing items + handle toolbox sub-items
        for (const item of toolbar.items) {
          const id = item.id ?? item.type;
          const knownTool = TOOLBAR_TOOLS.find(t => t.id === id || t.id === item.type);
          if (!knownTool) continue;
          const propsKey = `toolbar:${toolbarKey}:${knownTool.id}:props`;
          const propOverrides = overrides[propsKey];
          if (propOverrides) Object.assign(item, propOverrides);

          // Toolbox: apply sub-item overrides
          if (knownTool.id === 'toolbox') {
            const toolboxId = item.id ?? 'toolbox';
            if (!item.items) item.items = [];
            // Filter disabled sub-items
            item.items = item.items.filter(sub => {
              const sid = sub.id ?? sub.type;
              return overrides[`toolbox:${toolbarKey}:${toolboxId}:${sid}`] !== false
                && overrides[`toolbox:${toolbarKey}:${toolboxId}:${sub.type}`] !== false;
            });
            // Add newly enabled sub-items
            const existingSubIds = new Set(item.items.flatMap(s => [s.id, s.type].filter(Boolean)));
            for (const subTool of TOOLBAR_TOOLS.filter(t => t.id !== 'toolbox')) {
              const subKey = `toolbox:${toolbarKey}:${toolboxId}:${subTool.id}`;
              if (overrides[subKey] === true && !existingSubIds.has(subTool.id)) {
                const subProps = overrides[`${subKey}:props`] ?? {};
                item.items.push({ type: subTool.id, id: subTool.id, enabled: true, ...subProps });
              }
            }
          }
        }

        // Add newly enabled items not yet in config
        const existingIds = new Set(toolbar.items.flatMap(i => [i.id, i.type].filter(Boolean)));
        for (const tool of TOOLBAR_TOOLS) {
          const key = `toolbar:${toolbarKey}:${tool.id}`;
          if (overrides[key] === true && !existingIds.has(tool.id)) {
            const propsKey = `${key}:props`;
            const propOverrides = overrides[propsKey] ?? {};
            const newItem = { type: tool.id, id: tool.id, enabled: true, ...propOverrides };
            // Populate sub-items for newly added toolboxes
            if (tool.id === 'toolbox') {
              const toolboxId = newItem.id ?? 'toolbox';
              newItem.items = [];
              for (const subTool of TOOLBAR_TOOLS.filter(t => t.id !== 'toolbox')) {
                const subKey = `toolbox:${toolbarKey}:${toolboxId}:${subTool.id}`;
                if (overrides[subKey] === true) {
                  const subProps = overrides[`${subKey}:props`] ?? {};
                  newItem.items.push({ type: subTool.id, id: subTool.id, enabled: true, ...subProps });
                }
              }
            }
            toolbar.items.push(newItem);
          }
        }

        // Apply stored drag order to toolbar items
        const toolOrder = overrides[`order:toolbar:${toolbarKey}`];
        if (Array.isArray(toolOrder) && toolOrder.length > 0) {
          const itemById = new Map(toolbar.items.map(i => [i.id ?? i.type, i]));
          const ordered = toolOrder.map(id => itemById.get(id)).filter(Boolean);
          const unordered = toolbar.items.filter(i => !toolOrder.includes(i.id ?? i.type));
          toolbar.items = [...ordered, ...unordered];
        }

        // Apply stored drag order to toolbox sub-items
        for (const item of toolbar.items) {
          if ((item.id ?? item.type) !== 'toolbox' || !Array.isArray(item.items)) continue;
          const toolboxId = item.id ?? 'toolbox';
          const subOrder = overrides[`order:toolbox:${toolbarKey}:${toolboxId}`];
          if (Array.isArray(subOrder) && subOrder.length > 0) {
            const subById = new Map(item.items.map(s => [s.id ?? s.type, s]));
            const ordered = subOrder.map(id => subById.get(id)).filter(Boolean);
            const unordered = item.items.filter(s => !subOrder.includes(s.id ?? s.type));
            item.items = [...ordered, ...unordered];
          }
        }
      }

      // Standalone tools: update enabled or add if missing, apply prop overrides
      for (const tool of STANDALONE_TOOLS) {
        const key = `standalone:${tool.id}`;
        const propsKey = `${key}:props`;
        const propOverrides = overrides[propsKey];
        const enabledOverride = overrides[key];

        const existing = tools[tool.id];
        if (existing !== null && existing && typeof existing === 'object') {
          if (enabledOverride !== undefined) tools[tool.id] = { ...existing, enabled: enabledOverride };
          if (propOverrides) tools[tool.id] = { ...(tools[tool.id] ?? existing), ...propOverrides };
        } else if (existing === null || enabledOverride === true) {
          // null in config = present but unconfigured; build a real object
          tools[tool.id] = { enabled: enabledOverride ?? true, ...(propOverrides ?? {}) };
        }
      }

      // Dev tools
      result._devTools = { configedit: overrides['dev:configedit'] === true };

      return result;
    }

    function allCheckboxes() {
      return [...document.querySelectorAll('#ui input[type=checkbox]')];
    }

    function updateSelectAll() {
      const boxes = allCheckboxes();
      const allChecked = boxes.every(b => b.checked);
      const noneChecked = boxes.every(b => !b.checked);
      const sa = document.getElementById('select-all');
      sa.checked = allChecked;
      sa.indeterminate = !allChecked && !noneChecked;
    }

    document.getElementById('select-all').addEventListener('change', (e) => {
      const checked = e.target.checked;
      const ov = getSaved();
      allCheckboxes().forEach(cb => {
        cb.checked = checked;
        ov[cb.dataset.key] = checked;
      });
      saveOverrides(ov);
    });

    document.getElementById('btn-launch').addEventListener('click', () => {
      if (!baseConfig) return;
      const overrides = getSaved();
      const finalConfig = applyOverrides(baseConfig, overrides);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(finalConfig));
      // Reset engine to config value so any user override in preview is cleared.
      const engine = finalConfig.engine ?? finalConfig.map?.type ?? 'maplibre';
      localStorage.setItem('webmapx-adapter:map-webmapx', engine);
      window.open('testpages/preview.html', 'webmapx-preview');
      document.getElementById('status').textContent = 'Config saved — preview updated.';
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      saveOverrides({});
      buildUI(baseConfig, {});
      updateSelectAll();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(baseConfig));
      document.getElementById('status').textContent = 'Reset to defaults — preview updated.';
    });

    document.getElementById('btn-download').addEventListener('click', () => {
      if (!baseConfig) return;
      const finalConfig = applyOverrides(baseConfig, getSaved());
      const blob = new Blob([JSON.stringify(finalConfig, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'webmapx-config.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Init
    const config = await loadConfig();
    buildUI(config, getSaved());
    updateSelectAll();
  </script>
</body>
</html>
