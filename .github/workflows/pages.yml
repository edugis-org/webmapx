name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: echo '${{ secrets.APIKEYS_JSON }}' > config/apikeys.json
      - run: npm run build

      - name: Add demo assets
        run: |
          git clone --depth 1 https://github.com/edugis-org/webmapx-demo.git /tmp/webmapx-demo
          mkdir -p dist/config dist/styles
          cp -R /tmp/webmapx-demo/config/. dist/config/
          cp -R /tmp/webmapx-demo/styles/. dist/styles/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
