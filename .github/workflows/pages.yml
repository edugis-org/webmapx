name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # public/config is a checkout of the config repository, not content of
      # this one. This deploy is a preview of the build, not the published site
      # (that is edugis-org/webmapx-demo, which pins a config commit), so it
      # follows the config repository's main branch.
      - name: Fetch the configs
        run: npm run configs

      - run: echo '${{ secrets.APIKEYS_JSON }}' > public/config/apikeys.json
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
