<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="../favicon.png" type="image/png">
  <meta charset="utf-8">
  <title>Terrain test - MapLibre GL 3</title>
  <link href="https://unpkg.com/maplibre-gl@3/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/maplibre-gl@3/dist/maplibre-gl.js"></script>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          osm: {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          },
          terrain: {
            type: 'raster-dem',
            tiles: [
              'https://t1.edugis.nl/mapproxy/nextzenelevation/wmts/nextzenelevation/webmercator/{z}/{x}/{y}.png',
              'https://t2.edugis.nl/mapproxy/nextzenelevation/wmts/nextzenelevation/webmercator/{z}/{x}/{y}.png',
              'https://t3.edugis.nl/mapproxy/nextzenelevation/wmts/nextzenelevation/webmercator/{z}/{x}/{y}.png',
              'https://t4.edugis.nl/mapproxy/nextzenelevation/wmts/nextzenelevation/webmercator/{z}/{x}/{y}.png'
            ],
            tileSize: 256,
            encoding: 'terrarium',
            maxzoom: 15,
            attribution: 'NextZen'
          }
        },
        layers: [
          { id: 'osm', type: 'raster', source: 'osm' },
          { id: 'hillshade', type: 'hillshade', source: 'terrain', paint: { 'hillshade-exaggeration': 0.8 } }
        ]
      },
      center: [8.5, 46.8],
      zoom: 8,
      pitch: 45,
      maxPitch: 85
    });

    map.on('load', () => {
      map.setTerrain({ source: 'terrain', exaggeration: 1 });
    });
  </script>
</body>
</html>
