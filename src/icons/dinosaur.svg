<!-- A sauropod for the Deep time tool.

     Traced artwork, reduced to the four parts that survive 16px — body
     outline, neck, tail and legs; the finer details mushed into a smudge at
     rail size and are gone.

     The viewBox is cropped to the drawing's own bounds rather than the
     original 1920 square, which was 23% empty margin: at 16px that margin is
     what made the animal too small to recognise. Stroke 95 of a ~1580 box is
     about 1px there, matching the clock and gear beside it.

     No fill: an outline like every other icon in the rail, and `currentColor`
     so it follows the theme — sl-icon inlines this file into its shadow root,
     which is what makes that work. -->
