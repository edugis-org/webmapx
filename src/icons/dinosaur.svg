<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" height="16" width="16"
     fill="none" stroke="currentColor" stroke-width="1.05" stroke-linejoin="round" stroke-linecap="round">
<!-- A sauropod, traced as one continuous outline: snout, head, neck, back, tail,
     then back along the belly over four stubby legs.
     Outline rather than solid, because the toolbar's other icons are outlines
     and a filled silhouette reads far heavier than its neighbours.

     Proportions matter more than detail at this size. The body is deep — over
     four units between back and belly — and the neck and tail are thick where
     they leave it, tapering only towards the ends. Drawn thin, the same animal
     reads as a bird: a long neck on two spindly legs is a chicken, which is
     technically a dinosaur and not the one anyone pictures. -->
