         Q1.8 1.9 3.3 2.1
         Q4.7 2.4 5.2 5.2
         Q5.6 6.5 7.2 6.4
         Q9.4 6.2 10.6 7.3
         Q13.2 7.4 15.4 9.5
         Q13.8 10.4 11.4 10.6
         L11.4 12.9 L10.5 12.9 L10.4 10.8
         L9.6 10.9 L9.5 12.7 L8.6 12.7 L8.5 10.9
         L7.2 10.9 L7.1 12.9 L6.2 12.9 L6.1 10.8
         L5.4 10.6 L5.3 12.7 L4.5 12.7 L4.5 10.2
         Q4.6 9.6 4.6 9.1
