<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" height="16" width="16" fill="currentColor">
<!-- A sauropod: at 16 pixels the long neck and long tail are the only dinosaur
     anyone reads instantly, so everything else is sacrificed to them. The tail
     is thinner than the neck and sweeps lower — given the same weight and angle
     it reads as a second neck and the animal becomes a two-headed blob.

     One <path> per body part rather than one path of many subpaths. Subpaths of
     a single path interact through the fill rule, so a leg or a neck wound
     against the body cuts a hole in it instead of joining it — which came out
     as white notches at exactly the joints that most need to look solid.
     Separate elements simply paint over one another. -->
<ellipse cx="8" cy="8.8" rx="3.1" ry="1.9"/>
<path d="M2.6 3.1 Q3.0 7.5 6.0 8.8 L6.9 7.7 Q4.3 6.7 3.9 3.0 Z"/>
<ellipse cx="3.1" cy="2.55" rx="1.05" ry="0.8"/>
<path d="M2.2 2.2 L0.7 2.6 L2.2 3.15 Z"/>
<path d="M10.3 8.0 Q12.9 8.1 15.5 6.0 Q13.2 9.1 10.6 9.1 Z"/>
<rect x="5.9" y="9.2" width="1.5" height="4.1"/>
<rect x="7.9" y="9.4" width="1.4" height="3.9"/>
<rect x="9.7" y="9.4" width="1.4" height="3.9"/>
</svg>
