<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebMapX</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <!-- Shoelace themes - both loaded, class on html determines active -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.14.0/cdn/themes/light.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.14.0/cdn/themes/dark.css" />

    <link rel="stylesheet" href="./src/theme/webmapx-style-core.css">

    <link rel="stylesheet" href="./app.css">
    <script type="module" src="./src/app.js"></script>
</head>
<body>
    <div class="table">
        <div>
            <webmapx-map id="map-container" adapter="maplibre" src="config/demo.json">                
                    <webmapx-layout>
                        <webmapx-control-group slot="top-right" orientation="vertical" panel-position="after" alignment="start">
                        <webmapx-toolbar id="legend-toolbar" tooltip-placement="left">
                            <sl-button name="legend" size="medium" data-tooltip="Legend" aria-label="Legend">
                                <sl-icon name="card-list" label="Legend"></sl-icon>
                            </sl-button>
                        </webmapx-toolbar>

                        <webmapx-tool-panel id="legend-panel" label="Legenda">
                            <webmapx-layer-overview id="legend-tool" tool-id="legend"></webmapx-layer-overview>
                        </webmapx-tool-panel>
                    </webmapx-control-group>
                        
                        <!-- Top Left: Toolbar + Panel -->
                        <webmapx-control-group slot="top-left" orientation="vertical" panel-position="after" alignment="start">
                        <webmapx-toolbar id="main-toolbar">
                            <sl-button name="search" size="medium" data-tooltip="Search" aria-label="Search">
                                <sl-icon name="search" label="Search"></sl-icon>
                            </sl-button>
                            <sl-button name="layers" size="medium" data-tooltip="Layers" aria-label="Layers">
                                <sl-icon name="layers" label="Layers"></sl-icon>
                            </sl-button>
                            <sl-button name="measure" size="medium" data-tooltip="Measure" aria-label="Measure">
                                <sl-icon name="rulers" label="Measure"></sl-icon>
                            </sl-button>
                            <sl-button name="info" size="medium" data-tooltip="Feature info" aria-label="Feature info">
                                <sl-icon name="info-circle" label="Info"></sl-icon>
                            </sl-button>
                            <sl-button name="draw" size="medium" data-tooltip="Draw" aria-label="Draw">
                                <sl-icon name="pencil" label="Draw"></sl-icon>
                            </sl-button>
                            <sl-button name="geolocation" size="medium" data-tooltip="Geolocation" aria-label="Geolocation">
                                <sl-icon name="crosshair" label="Geolocation"></sl-icon>
                            </sl-button>
                            <sl-button name="view-mode" size="medium" data-tooltip="View mode" aria-label="View mode">
                                <sl-icon name="globe" label="View mode"></sl-icon>
                            </sl-button>
                            <div style="flex:1; pointer-events:none"></div>
                            <sl-button name="settings" size="medium" data-tooltip="Settings" aria-label="Settings">
                                <sl-icon name="gear" label="Settings"></sl-icon>
                            </sl-button>
                        </webmapx-toolbar>

                        <webmapx-tool-panel id="tool-panel" label="Tools">
                            <webmapx-layer-tree id="layer-tool" tool-id="layers"></webmapx-layer-tree>
                            <webmapx-search-tool id="search-tool" tool-id="search"></webmapx-search-tool>
                            <webmapx-measure-tool id="measure-tool" tool-id="measure"></webmapx-measure-tool>
                            <webmapx-info-tool id="info-tool" tool-id="info"></webmapx-info-tool>
                            <webmapx-draw-tool id="draw-tool" tool-id="draw"></webmapx-draw-tool>
                            <webmapx-settings id="settings-tool" tool-id="settings"></webmapx-settings>
                            <webmapx-geolocation-tool id="geolocation-tool" tool-id="geolocation"></webmapx-geolocation-tool>
                            <webmapx-view-mode-tool id="view-mode-tool" tool-id="view-mode"></webmapx-view-mode-tool>
                        </webmapx-tool-panel>
                    </webmapx-control-group>
                    <webmapx-scale-control
                        slot="bottom-right"
                        max-width="140"
                        style="--webmapx-tool-margin: 0 0 5px 0"
                    ></webmapx-scale-control>
                    <webmapx-attribution-control slot="edge-bottom-right"></webmapx-attribution-control>

                    <webmapx-coordinates-tool slot="bottom-center"></webmapx-coordinates-tool>
                    <webmapx-navigation-control slot="bottom-left" direction="horizontal" orientation="vertical"></webmapx-navigation-control>
                    <webmapx-zoom-level slot="bottom-left"></webmapx-zoom-level>
                    <webmapx-inset-map slot="bottom-left" zoom-offset="-4" minimizable></webmapx-inset-map>
                    <webmapx-spinner slot="middle-center"></webmapx-spinner>
                </webmapx-layout>

            </webmapx-map>
        </div>
        
        <!-- External Tools Column -->
        <div id="external-tools-column">
            <h3>External Tools</h3>
            <p>The tools below are outside the map but linked to it.</p>
            <div id="external-tools-scroll">
                <webmapx-active-adapter map="#map-container"></webmapx-active-adapter>
                <webmapx-zoom-level map="#map-container"></webmapx-zoom-level>
                <webmapx-inset-map map="#map-container" zoom-offset="-5" minimizable></webmapx-inset-map>
                <webmapx-tool-template map="#map-container"></webmapx-tool-template>
                <div id="truearea-host">
                    <button id="truearea-button">True Area tool</button>
                    <div id="truearea-output"></div>
                </div>
                <webmapx-spinner map="#map-container"></webmapx-spinner>
                <div>
                    <button id="external-geolocation-button">Geolocation tool</button>
                    <div id="external-geolocation-output"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const map = document.getElementById('map-container');
        const externalGeoButton = document.getElementById('external-geolocation-button');
        const externalGeoOutput = document.getElementById('external-geolocation-output');
        const externalToolsHost = externalGeoButton?.closest('div');

        const setExternalGeoLabel = (active) => {
            if (!externalGeoButton) return;
            externalGeoButton.textContent = active ? 'Deactivate Geolocation tool' : 'Geolocation tool';
        };

        const updateExternalLabelFromTool = () => {
            const tool = externalToolsHost?.querySelector('webmapx-geolocation-tool');
            setExternalGeoLabel(Boolean(tool?.active));
        };

        const trueAreaButton = document.getElementById('truearea-button');
        const trueAreaOutput = document.getElementById('truearea-output');

        const setTrueAreaLabel = (active) => {
            if (trueAreaButton) trueAreaButton.textContent = active ? 'Deactivate True Area tool' : 'True Area tool';
        };

        map?.addEventListener('webmapx-tool-activated', (e) => {
            if (e.detail?.toolId === 'geolocation') {
                updateExternalLabelFromTool();
            }
        });

        map?.addEventListener('webmapx-tool-deactivated', (e) => {
            if (e.detail?.toolId === 'geolocation') {
                updateExternalLabelFromTool();
            }
            if (e.detail?.toolId === 'truearea') {
                setTrueAreaLabel(false);
            }
        });

        trueAreaButton?.addEventListener('click', () => {
            if (!trueAreaOutput) return;
            let tool = trueAreaOutput.querySelector('webmapx-truearea-tool');
            if (!tool) {
                tool = document.createElement('webmapx-truearea-tool');
                tool.setAttribute('map', '#map-container');
                trueAreaOutput.appendChild(tool);
            }
            if (tool.active) {
                tool.deactivate?.();
            } else {
                tool.activate?.();
            }
            setTrueAreaLabel(tool.active);
        });

        externalGeoButton?.addEventListener('click', () => {
            if (!externalGeoOutput || !externalToolsHost) return;
            let tool = externalToolsHost.querySelector('webmapx-geolocation-tool');
            if (!tool) {
                tool = document.createElement('webmapx-geolocation-tool');
                tool.setAttribute('map', '#map-container');
                tool.setAttribute('render-target', '#external-geolocation-output');
                externalToolsHost.appendChild(tool);
            }
            if (tool.active) {
                tool.deactivate?.();
            } else {
                tool.activate?.();
            }
            updateExternalLabelFromTool();
        });
    </script>

</body>
</html>
