<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>WebMapX</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <!-- Shoelace themes - both loaded, class on html determines active -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.14.0/cdn/themes/light.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.14.0/cdn/themes/dark.css" />

    <link rel="stylesheet" href="./src/theme/webmapx-style-core.css">

    <link rel="stylesheet" href="./app.css">
    <script type="module" src="./src/app.js"></script>
</head>
<body>
    <div class="table">
        <div>
            <webmapx-map id="map-container" adapter="maplibre" src="config/demo.json">
                    <webmapx-layout></webmapx-layout>
            </webmapx-map>
        </div>
        
        <!-- External Tools Column -->
        <div id="external-tools-column">
            <h3>External Tools</h3>
            <p>The tools below are outside the map but linked to it.</p>
            <div id="external-tools-scroll">
                <webmapx-active-adapter map="#map-container"></webmapx-active-adapter>
                <webmapx-zoom-level map="#map-container"></webmapx-zoom-level>
                <webmapx-inset-map map="#map-container" zoom-offset="-5" minimizable background-layer="osm"></webmapx-inset-map>
                <webmapx-tool-template map="#map-container"></webmapx-tool-template>
                <div id="truearea-host">
                    <button id="truearea-button">True Area tool</button>
                    <div id="truearea-output"></div>
                </div>
                <webmapx-spinner map="#map-container"></webmapx-spinner>
                <div>
                    <button id="external-geolocation-button">Geolocation tool</button>
                    <div id="external-geolocation-output"></div>
                </div>
                <div>
                    <button id="external-language-button">Map language tool</button>
                    <div id="external-language-output"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const map = document.getElementById('map-container');
        const externalGeoButton = document.getElementById('external-geolocation-button');
        const externalGeoOutput = document.getElementById('external-geolocation-output');
        const externalToolsHost = externalGeoButton?.closest('div');

        const externalLanguageButton = document.getElementById('external-language-button');
        const externalLanguageOutput = document.getElementById('external-language-output');
        const externalLanguageHost = externalLanguageButton?.closest('div');

        const setExternalLanguageLabel = (active) => {
            if (externalLanguageButton) externalLanguageButton.textContent = active ? 'Close Map language tool' : 'Map language tool';
        };

        const updateExternalLanguageLabelFromTool = () => {
            const tool = externalLanguageHost?.querySelector('webmapx-language-osmvector');
            setExternalLanguageLabel(Boolean(tool?.active));
        };

        const setExternalGeoLabel = (active) => {
            if (!externalGeoButton) return;
            externalGeoButton.textContent = active ? 'Deactivate Geolocation tool' : 'Geolocation tool';
        };

        const updateExternalLabelFromTool = () => {
            const tool = externalToolsHost?.querySelector('webmapx-geolocation-tool');
            setExternalGeoLabel(Boolean(tool?.active));
        };

        const trueAreaButton = document.getElementById('truearea-button');
        const trueAreaOutput = document.getElementById('truearea-output');

        const setTrueAreaLabel = (active) => {
            if (trueAreaButton) trueAreaButton.textContent = active ? 'Deactivate True Area tool' : 'True Area tool';
        };

        map?.addEventListener('webmapx-tool-activated', (e) => {
            if (e.detail?.toolId === 'geolocation') {
                updateExternalLabelFromTool();
            }
            if (e.detail?.toolId === 'maplanguage') {
                updateExternalLanguageLabelFromTool();
            }
        });

        map?.addEventListener('webmapx-tool-deactivated', (e) => {
            if (e.detail?.toolId === 'geolocation') {
                updateExternalLabelFromTool();
            }
            if (e.detail?.toolId === 'truearea') {
                setTrueAreaLabel(false);
            }
            if (e.detail?.toolId === 'maplanguage') {
                updateExternalLanguageLabelFromTool();
            }
        });

        trueAreaButton?.addEventListener('click', () => {
            if (!trueAreaOutput) return;
            let tool = trueAreaOutput.querySelector('webmapx-truearea-tool');
            if (!tool) {
                tool = document.createElement('webmapx-truearea-tool');
                tool.setAttribute('map', '#map-container');
                trueAreaOutput.appendChild(tool);
            }
            if (tool.active) {
                tool.deactivate?.();
            } else {
                tool.activate?.();
            }
            setTrueAreaLabel(tool.active);
        });

        externalGeoButton?.addEventListener('click', () => {
            if (!externalGeoOutput || !externalToolsHost) return;
            let tool = externalToolsHost.querySelector('webmapx-geolocation-tool');
            if (!tool) {
                tool = document.createElement('webmapx-geolocation-tool');
                tool.setAttribute('map', '#map-container');
                tool.setAttribute('render-target', '#external-geolocation-output');
                externalToolsHost.appendChild(tool);
            }
            if (tool.active) {
                tool.deactivate?.();
            } else {
                tool.activate?.();
            }
            updateExternalLabelFromTool();
        });

        externalLanguageButton?.addEventListener('click', () => {
            if (!externalLanguageOutput || !externalLanguageHost) return;
            let tool = externalLanguageHost.querySelector('webmapx-language-osmvector');
            if (!tool) {
                tool = document.createElement('webmapx-language-osmvector');
                tool.setAttribute('map', '#map-container');
                tool.setAttribute('language', 'browser');
                tool.setAttribute('render-target', '#external-language-output');
                externalLanguageHost.appendChild(tool);
            }
            if (tool.active) {
                tool.deactivate?.();
            } else {
                tool.activate?.();
            }
            updateExternalLanguageLabelFromTool();
        });
    </script>

</body>
</html>
